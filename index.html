<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png?v=3" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=3" />
    <style>
      #initial-loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #FFFFFF;
        opacity: 1;
        transition: opacity 450ms ease;
      }

      #initial-loading-screen-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }

      #initial-loading-screen.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #initial-loading-screen img {
        width: min(58vw, 280px);
        height: auto;
        animation: logo-loading-pulse 1.4s ease-in-out infinite;
      }

      #initial-loading-credit {
        color: #B55232;
        font: 500 0.7rem/1.4 'Jost', sans-serif;
        letter-spacing: 0.16em;
        text-align: center;
        text-transform: uppercase;
      }

      @keyframes logo-loading-pulse {
        0%, 100% {
          transform: scale(0.94);
          opacity: 0.78;
          filter: drop-shadow(0 0 0 rgba(181, 82, 50, 0));
        }
        50% {
          transform: scale(1.04);
          opacity: 1;
          filter:
            drop-shadow(0 0 10px rgba(181, 82, 50, 0.42))
            drop-shadow(0 0 24px rgba(181, 82, 50, 0.2));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loading-screen img {
          animation: none;
        }

        #initial-loading-screen {
          transition: none;
        }
      }
    </style>
    <title>Luxury Abayas & Premium Modest Wear in India | LaClassé</title>
    <meta name="description" content="Shop LaClassé luxury abayas for modern women. Discover lightweight, opaque modest wear, elegant occasion styles, custom sizing, and graceful designs made for India's climate." />
    <meta name="keywords" content="LaClassé Abaya, luxury abayas India, premium modest wear, women's abaya, lightweight abaya, chiffon abaya, embroidered abaya, bridal abaya, custom size abaya, Kerala abaya" />
    <meta name="author" content="LaClassé Abaya" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Luxury Abayas & Premium Modest Wear in India | LaClassé" />
    <meta property="og:description" content="Discover lightweight, elegant abayas with graceful cuts, premium fabrics, and custom sizing—designed for modern women and India's climate." />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=1200&auto=format&fit=crop" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Luxury Abayas & Premium Modest Wear in India | LaClassé" />
    <meta property="twitter:description" content="Lightweight, elegant abayas with premium fabrics and custom sizing, designed for modern women in India." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=1200&auto=format&fit=crop" />

    <!-- Google Fonts: Montserrat & Jost Geometric Sans-Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FFFFFF] text-[#000000] font-sans antialiased selection:bg-[#000000] selection:text-[#FFFFFF] overflow-x-hidden">
    <div id="initial-loading-screen" role="status" aria-label="Loading LaClassé">
      <div id="initial-loading-screen-content">
        <img src="/loading-logo.png" alt="LaClassé" fetchpriority="high" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
